<title>手机钥匙 · 设计文档</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;1,6..72,300&family=IBM+Plex+Mono:wght@400;500&display=swap">

<style>
/* ═══════════════════════════════════════════════════════════════
   页面本身的外观。刻意用衬线体——框里的每一个像素都是产品自己的
   Manrope，这样读的人永远分得清哪是产品、哪是说明。
   ═══════════════════════════════════════════════════════════════ */
:root {
  --page-bg:#f4f5f1; --page-panel:#ffffff; --page-ink:#2b332a;
  --page-sub:#5e685b; --page-muted:#78806f; --page-line:#e3e7dd;
  --page-rail:#eceee7;
  --accent:#526a43; --redline:#b4744a; --okline:#5c7a45;
  --serif:"Newsreader", Georgia, "Songti SC", serif;
  --sans:"Manrope", -apple-system, "PingFang SC", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page-bg:#171d17; --page-panel:#1e261e; --page-ink:#dfe6da;
    --page-sub:#b2bdac; --page-muted:#8f9a89; --page-line:#333c31;
    --page-rail:#1b221b; --accent:#a9c391; --redline:#d09a70; --okline:#9cbb7f;
  }
}
:root[data-theme="dark"] {
  --page-bg:#171d17; --page-panel:#1e261e; --page-ink:#dfe6da;
  --page-sub:#b2bdac; --page-muted:#8f9a89; --page-line:#333c31;
  --page-rail:#1b221b; --accent:#a9c391; --redline:#d09a70; --okline:#9cbb7f;
}

/* ═══════════════════════════════════════════════════════════════
   产品 token。框里不允许出现裸色值：缺的值会得到一个名字，
   而不是一个例外。整套在切换深色时一起翻面。
   ═══════════════════════════════════════════════════════════════ */
.stage {
  --bg:#fbfcf9; --sidebar:#f3f5ee; --panel:#fff; --sage:#eff3e9;
  --active:#e5ebdc; --peach:#f7f0e9; --muted-surface:#f4f5f2;
  --text:#303b32; --subtle:#677160; --muted:#6f766c;
  --ink-nav:#727d6b; --ink-nav-on:#4e6440; --ink-label:#9aa190;
  --ink-tagline:#7a8472; --ink-crumb:#7c8576; --ink-icon:#8c9b7d;
  --ink-badge:#839574; --ink-link:#627255; --ink-onsage:#78876d;
  --ink-sageStrong:#6c8354; --ink-outline:#6b7a60; --ink-amber:#83693f;
  --line:#e9ece4; --line-amber:#ecdfc8; --line-chip:#d8dfd0;
  --line-frame:rgba(35,53,36,.16);
  --green:#526a43; --dark-green:#3e5738; --green-mark:#6c8354; --green-dot:#90a577;
  --track:#dce1d7; --knob:#fff; --chev:#b6bdb1; --chip-off-bg:#eef0ea;
  --bezel:#12160f;
  --shadow:0 12px 35px #23352406;
  --shadow-win:0 22px 60px rgba(35,53,36,.13);
  --shadow-sheet:0 24px 90px rgba(23,40,16,.2);
  --shadow-knob:0 1px 2px rgba(0,0,0,.13);
}
.stage[data-product="dark"] {
  --bg:#202b24; --sidebar:#1b251e; --panel:#26322a; --sage:#303e2b;
  --active:#34442d; --peach:#41382e; --muted-surface:#2b3729;
  --text:#d5dece; --subtle:#abb9a0; --muted:#8c9b83;
  --ink-nav:#94a68a; --ink-nav-on:#b4c6a0; --ink-label:#7f8c77;
  --ink-tagline:#8a9880; --ink-crumb:#8a9880; --ink-icon:#8fa27c;
  --ink-badge:#9db188; --ink-link:#a8bc90; --ink-onsage:#9db188;
  --ink-sageStrong:#b7d199; --ink-outline:#a8bc90; --ink-amber:#d9bd86;
  --line:#354031; --line-amber:#4a3f28; --line-chip:#44513d;
  --line-frame:rgba(0,0,0,.5);
  --green:#7e9865; --dark-green:#78925e; --green-mark:#8fae72; --green-dot:#a0bc86;
  --track:#3d4b37; --knob:#cdd8c4; --chev:#6b7a63; --chip-off-bg:#2e3a2b;
  --shadow:none; --shadow-win:0 22px 60px rgba(0,0,0,.4);
  --shadow-sheet:0 24px 90px rgba(0,0,0,.55);
}

* { box-sizing:border-box; }
body { margin:0; background:var(--page-bg); color:var(--page-ink);
       font-family:var(--sans); font-size:16px; line-height:1.75;
       -webkit-font-smoothing:antialiased; }
h1,h2,h3.serif,.lede { font-family:var(--serif); font-weight:400; }
h1 { font-size:clamp(32px,4.4vw,46px); line-height:1.1; letter-spacing:-.015em; margin:0 0 16px; }
h1 em { font-style:italic; color:var(--accent); }
h2 { font-size:clamp(23px,3vw,30px); line-height:1.22; margin:0 0 6px; }
h3 { font-family:var(--sans); font-size:16px; font-weight:700; margin:0 0 4px; }
.lede { font-size:19px; line-height:1.62; color:var(--page-sub); margin:0; }
.section-lede { color:var(--page-sub); margin:8px 0 22px; max-width:660px; }
code { font-family:var(--mono); font-size:.86em; }

.shell { display:grid; grid-template-columns:232px minmax(0,1fr); }
@media (max-width:980px) { .shell { grid-template-columns:1fr; } }
.rail { position:sticky; top:0; align-self:start; height:100vh; overflow-y:auto;
        background:var(--page-rail); border-right:1px solid var(--page-line);
        padding:26px 18px 40px; }
@media (max-width:980px) {
  .rail { position:static; height:auto; border-right:0; border-bottom:1px solid var(--page-line); }
}
.rail .brand { font-family:var(--serif); font-size:19px; line-height:1.25; margin:0 0 4px; }
.rail .brandsub { font-family:var(--mono); font-size:10px; letter-spacing:.1em;
                  text-transform:uppercase; color:var(--page-muted); margin:0 0 20px; }
.railgrp { font-family:var(--mono); font-size:9.5px; letter-spacing:.12em; text-transform:uppercase;
           color:var(--page-muted); margin:18px 0 6px; }
.railitem { display:block; width:100%; text-align:left; border:0; background:none; cursor:pointer;
            font-family:var(--sans); font-size:13.5px; color:var(--page-sub); line-height:1.4;
            padding:7px 10px; border-radius:8px; }
.railitem:hover { background:color-mix(in srgb, var(--page-line) 60%, transparent); }
.railitem.on { background:var(--page-panel); color:var(--page-ink); font-weight:600;
               box-shadow:0 1px 2px rgba(0,0,0,.04); }
.railitem .n { font-family:var(--mono); font-size:10px; color:var(--page-muted); margin-right:8px; }
.railitem.on .n { color:var(--accent); }
.railtools { margin-top:24px; padding-top:16px; border-top:1px solid var(--page-line); display:grid; gap:8px; }
.tool { display:flex; align-items:center; justify-content:space-between; gap:10px;
        font-size:12px; color:var(--page-sub); }
.tool button { font:inherit; font-size:11px; cursor:pointer; padding:4px 10px; border-radius:20px;
               border:1px solid var(--page-line); background:var(--page-panel); color:var(--page-ink); }
.tool button.on { background:var(--accent); border-color:var(--accent); color:var(--page-bg); }

.main { padding:30px 34px 120px; max-width:1180px; }
@media (max-width:620px) { .main { padding:24px 16px 80px; } }
.chapter { animation:fade .24s ease; }
@keyframes fade { from { opacity:0; transform:translateY(5px); } to { opacity:1; transform:none; } }
@media (prefers-reduced-motion: reduce) { .chapter { animation:none; } }
.chnum { font-family:var(--mono); font-size:11px; letter-spacing:.12em; color:var(--accent);
         display:block; margin-bottom:6px; }

.plate { display:grid; grid-template-columns:minmax(0,1fr) 292px; gap:28px; align-items:start; margin-top:22px; }
@media (max-width:1160px) { .plate { grid-template-columns:1fr; } }
.plate.stack { grid-template-columns:1fr; }
.frame-note { font-family:var(--mono); font-size:10.5px; letter-spacing:.09em; text-transform:uppercase;
              color:var(--page-muted); margin:0 0 9px; display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
.frame-note b { color:var(--accent); font-weight:500; }
.scroller { overflow-x:auto; padding-bottom:8px; }
.spec { background:var(--page-panel); border:1px solid var(--page-line); border-radius:14px;
        padding:16px 18px; font-size:13px; line-height:1.7; }
.spec h4 { font-family:var(--mono); font-size:10.5px; letter-spacing:.09em; text-transform:uppercase;
           color:var(--page-muted); font-weight:400; margin:0 0 8px; }
.spec h4 + h4 { margin-top:14px; }
.spec p { margin:0 0 10px; color:var(--page-sub); font-size:12.5px; line-height:1.72; }
.spec p:last-child { margin-bottom:0; }
.spec dl { margin:0 0 12px; display:grid; grid-template-columns:auto 1fr; gap:3px 12px; }
.spec dt { font-family:var(--mono); font-size:11px; color:var(--page-muted); white-space:nowrap; }
.spec dd { margin:0; font-family:var(--mono); font-size:11px; color:var(--page-ink); }

.tbl-wrap { overflow-x:auto; margin:26px 0 8px; }
table.after { border-collapse:collapse; width:100%; font-size:13.5px; min-width:660px; }
table.after th, table.after td { text-align:left; vertical-align:top; padding:11px 14px;
                                 border-bottom:1px solid var(--page-line); }
table.after th { font-family:var(--mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase;
                 color:var(--page-muted); font-weight:400; }
table.after td:first-child { white-space:nowrap; font-weight:600; }
table.after .fail { color:var(--redline); }
.voice { border-collapse:collapse; width:100%; font-size:14px; margin-top:16px; }
.voice td { padding:10px 14px; border-bottom:1px solid var(--page-line); vertical-align:top; width:50%; }
.voice td.no { color:var(--redline); text-decoration:line-through; text-decoration-color:color-mix(in srgb,var(--redline) 45%,transparent); }
.voice td.yes { color:var(--page-ink); font-weight:600; }
.pill { display:inline-block; font-family:var(--mono); font-size:10px; letter-spacing:.06em;
        padding:2px 8px; border-radius:20px; border:1px solid var(--page-line); color:var(--page-muted); }
.pill.ok { color:var(--okline); border-color:color-mix(in srgb, var(--okline) 40%, transparent); }
.pill.no { color:var(--redline); border-color:color-mix(in srgb, var(--redline) 40%, transparent); }
.callout { border:1px solid var(--page-line); border-left:3px solid var(--accent);
           background:var(--page-panel); border-radius:0 12px 12px 0;
           padding:14px 18px; margin:18px 0; font-size:14px; color:var(--page-sub); }
.callout.warn { border-left-color:var(--redline); }
.callout b { color:var(--page-ink); }
pre.proto { font-family:var(--mono); font-size:11.5px; line-height:1.9; background:var(--page-panel);
            border:1px solid var(--page-line); border-radius:10px; padding:16px 18px; overflow-x:auto; }

/* ── Mac 窗口 ─────────────────────────────────────────────────── */
.stage { font-family:var(--sans); }
.mac { width:1060px; border-radius:13px; overflow:hidden; background:var(--bg);
       box-shadow:var(--shadow-win); border:1px solid var(--line-frame); }
.mac.narrow { width:840px; }
.titlebar { height:35px; background:var(--sidebar); border-bottom:1px solid var(--line);
            display:flex; align-items:center; gap:7px; padding:0 13px; }
.titlebar i { width:11px; height:11px; border-radius:50%; background:var(--track); }
.titlebar span { flex:1; text-align:center; font-size:11px; color:var(--ink-crumb); }
.macbody { display:flex; height:620px; }
.side { width:218px; flex:none; background:var(--sidebar); border-right:1px solid var(--line);
        padding:26px 20px 0; overflow-y:auto; }
.brandrow { display:flex; align-items:center; gap:9px; }
.mark { width:24px; height:24px; position:relative; flex:none; }
.mark i { position:absolute; width:11px; height:11px; border-radius:50% 50% 50% 0; background:var(--green-mark); }
.mark i:nth-child(1) { top:0; left:6px; transform:rotate(-45deg); }
.mark i:nth-child(2) { top:6px; right:0; transform:rotate(45deg); }
.mark i:nth-child(3) { bottom:0; left:6px; transform:rotate(135deg); }
.mark i:nth-child(4) { top:6px; left:0; transform:rotate(-135deg); }
.word { font-size:21px; font-weight:800; letter-spacing:-.8px; color:var(--text); }
.word em { font-style:normal; color:var(--green); }
.tagline { font-size:10.5px; color:var(--ink-tagline); margin:8px 0 20px; }
.navlabel { font-family:var(--mono); font-size:9px; letter-spacing:.13em; text-transform:uppercase;
            color:var(--ink-label); margin:16px 0 6px 4px; }
.nav { display:flex; align-items:center; gap:11px; height:38px; padding:0 11px; border-radius:8px;
       font-size:12.5px; color:var(--ink-nav); cursor:pointer; }
.nav:hover { background:color-mix(in srgb, var(--active) 55%, transparent); }
.nav.on { background:var(--active); color:var(--ink-nav-on); font-weight:600; }
.nav svg { width:17px; height:17px; flex:none; stroke-width:1.6; }
.content { flex:1; overflow-y:auto; padding:0 34px 40px; }
.topbar { height:62px; display:flex; align-items:center; justify-content:space-between;
          font-size:11px; color:var(--ink-crumb); }
.crumbs { display:flex; gap:7px; align-items:center; }
.pagehead { padding:6px 0 20px; }
.kicker { font-family:var(--mono); font-size:9.5px; letter-spacing:.16em; text-transform:uppercase;
          color:var(--ink-label); margin:0 0 8px; }
.pagehead h1 { font-family:var(--sans); font-size:27px; font-weight:600; letter-spacing:.3px;
               margin:0 0 7px; color:var(--text); }
.pagehead p { margin:0; font-size:12.5px; color:var(--subtle); }
.panel { background:var(--panel); border:1px solid var(--line); border-radius:12px;
         padding:22px 24px; box-shadow:var(--shadow); }
.panel + .panel { margin-top:16px; }
.sechead { display:flex; align-items:flex-start; justify-content:space-between; gap:16px; }
.sechead h2 { font-family:var(--sans); font-size:14px; font-weight:600; letter-spacing:.4px; margin:0; color:var(--text); }
.sechead p { margin:5px 0 0; font-size:11.5px; color:var(--muted); }
.prow { display:flex; align-items:flex-start; gap:15px; padding:17px 0; border-top:1px solid var(--line); }
.prow:first-of-type { border-top:0; }
.prow .ico { width:24px; flex:none; color:var(--ink-icon); margin-top:1px; }
.prow .g { flex:1; min-width:0; }
.prow h3 { font-size:12.5px; font-weight:600; color:var(--text); margin:0 0 4px; }
.prow p { margin:0; font-size:11px; line-height:1.68; color:var(--muted); }
.state { display:flex; align-items:center; gap:7px; font-size:11px; color:var(--muted); margin:0; }
.state.on { color:var(--ink-sageStrong); }
.dot { width:7px; height:7px; border-radius:50%; background:var(--green-dot); flex:none; }
.dot.grey { background:var(--chev); }
.toggle { width:35px; height:20px; border-radius:25px; background:var(--track); padding:3px;
          display:inline-flex; flex:none; cursor:pointer; transition:background .16s; }
.toggle span { width:14px; height:14px; border-radius:50%; background:var(--knob);
               box-shadow:var(--shadow-knob); transition:margin .16s; }
.toggle.on { background:var(--green); }
.toggle.on span { margin-left:15px; }
.toggle.sm { width:30px; height:18px; padding:2px; }
.toggle.sm span { width:14px; height:14px; }
.toggle.sm.on span { margin-left:12px; }
.btn { display:inline-flex; align-items:center; justify-content:center; gap:7px; height:34px;
       padding:0 16px; border-radius:9px; font-size:11.5px; font-weight:600; cursor:pointer;
       border:1px solid transparent; background:var(--sage); color:var(--ink-outline); font-family:var(--sans); }
.btn.primary { background:var(--green); color:#fff; }
.btn.outline { background:transparent; border-color:var(--line-chip); color:var(--ink-outline); }
.tbtn { font-size:11px; font-weight:600; color:var(--ink-link); cursor:pointer; white-space:nowrap;
        background:none; border:0; font-family:var(--sans); padding:0; }
.devlist { display:grid; gap:9px; }
.dev { display:flex; align-items:flex-start; gap:13px; padding:14px 15px; border-radius:11px; border:1px solid var(--line); }
.dev .av { width:34px; height:34px; border-radius:10px; background:var(--sage); flex:none;
           display:grid; place-items:center; color:var(--green); }
.dev .g { flex:1; min-width:0; }
.dev b { display:block; font-size:12.5px; color:var(--text); }
.dev .sub { display:block; font-size:10.5px; color:var(--muted); margin-top:3px; }
.caps { display:flex; gap:20px; margin-top:11px; flex-wrap:wrap; }
.cap { display:flex; align-items:center; gap:8px; font-size:11px; color:var(--subtle); cursor:pointer; }
.bands { display:flex; align-items:center; gap:10px; margin-top:12px; padding-top:11px;
         border-top:1px dashed var(--line); flex-wrap:wrap; }
.bands .when { font-size:10.5px; color:var(--muted); }
.chip { font-size:10px; padding:3px 9px; border-radius:20px; border:1px solid var(--line-chip); color:var(--ink-badge); }
.chip.no { color:var(--muted); }
.fold { font-size:11.5px; color:var(--ink-link); cursor:pointer; margin:14px 0 0; }
.foot { font-size:10.5px; color:var(--muted); margin:12px 0 0; }
.amber { background:var(--peach); border:1px solid var(--line-amber); border-radius:10px;
         padding:13px 15px; font-size:11px; line-height:1.72; color:var(--ink-amber); margin-top:14px; }
.apptabs { display:flex; gap:8px; flex-wrap:wrap; margin-top:16px; }
.apptab { display:inline-flex; align-items:center; gap:7px; padding:7px 13px; font-size:12px;
          border-radius:999px; background:var(--sage); color:var(--text); cursor:pointer;
          border:1px solid transparent; font-family:var(--sans); }
.apptab .ct { font-family:var(--mono); font-size:10px; color:var(--muted); }
.apptab.on { background:var(--active); border-color:var(--green); font-weight:600; }
.apptab.on .ct { color:var(--text); }
.apptab.add { color:var(--muted); }
.actrow { display:flex; align-items:center; gap:12px; padding:9px 0; border-top:1px solid var(--line); }
.actrow:first-child { border-top:0; }
.actname { flex:1; min-width:0; font-size:12.5px; color:var(--text); display:flex; gap:8px; align-items:center; }
.keys { display:flex; gap:5px; flex:none; }
.kbd { font-family:var(--mono); font-size:10.5px; padding:3px 7px; border-radius:6px;
       border:1px solid var(--line-chip); border-bottom-width:2px; background:var(--panel); color:var(--text); }
.iconbtn { width:28px; height:28px; border-radius:8px; border:1px solid var(--line); background:none;
           color:var(--ink-link); cursor:pointer; display:grid; place-items:center; font-size:12px; }

/* ── 手机 ─────────────────────────────────────────────────────── */
.phone { width:361px; flex:none; border-radius:34px; padding:9px; background:var(--bezel); box-shadow:var(--shadow-win); }
.phone.sm { width:300px; border-radius:29px; padding:7px; }
.pscreen { border-radius:26px; overflow:hidden; background:var(--bg); height:722px; display:flex; flex-direction:column; }
.phone.sm .pscreen { height:600px; border-radius:23px; }
.pstatus { display:flex; justify-content:space-between; padding:11px 18px 4px; font-size:11px;
           font-weight:600; color:var(--text); flex:none; }
.pbody { padding:10px 18px 22px; overflow-y:auto; flex:1; }
.phead { display:flex; align-items:center; gap:10px; margin-bottom:14px; }
.mark.m { width:20px; height:20px; }
.mark.m i { width:9px; height:9px; }
.mark.m i:nth-child(1),.mark.m i:nth-child(3) { left:5px; }
.mark.m i:nth-child(2),.mark.m i:nth-child(4) { top:5px; }
.pword { font-size:19px; font-weight:800; letter-spacing:-.9px; color:var(--text); }
.pword em { font-style:normal; color:var(--green); }
.ptag { font-family:var(--sans); font-size:10.5px; color:var(--muted); }
.pback { display:inline-flex; align-items:center; gap:6px; font-size:14px; color:var(--green); cursor:pointer; margin-bottom:8px; }
.ptitle { font-size:22px; font-weight:800; color:var(--text); margin:2px 0 8px; letter-spacing:-.3px; }
.plead { font-size:12.5px; line-height:1.7; color:var(--subtle); margin:0 0 4px; }
.phero { background:var(--sage); border-radius:20px; padding:18px; text-align:center; }
.phero .disc { width:76px; height:76px; border-radius:50%; background:var(--panel); margin:6px auto 12px;
               display:grid; place-items:center; font-size:30px; }
.phero h3 { font-size:17px; font-weight:700; color:var(--text); margin:0 0 5px; }
.phero p { font-size:11.5px; color:var(--subtle); margin:0; line-height:1.65; }
.prow2 { display:flex; align-items:center; gap:12px; background:var(--panel); border-radius:16px;
         padding:14px 15px; margin-top:12px; border:1px solid var(--line); }
.prow2 .g { flex:1; min-width:0; }
.prow2 b { display:block; font-size:14px; font-weight:700; color:var(--text); }

<script>
'use strict';
/* ═══════════════════════════════════════════════════════════════════════════
   一个状态对象，一个 render。
   主界面那一章是活的：开关和按钮改 S，画面重画。
   流程那几章是铺开的：每一帧用一个覆盖过的状态画出来，读的人不用点。
   ═══════════════════════════════════════════════════════════════════════════ */

const fresh = () => ({
  macTab:'phone', presence:true, idleLock:true, a11y:false, more:false,
  phones:[
    { id:'p1', name:'真我GT5 Pro', unlock:true, control:true, seen:'刚刚见到', paired:'9 月 11 日配好',

      near:null, far:null, calAt:null },
  ],
  apps:[
    { id:'tmux', name:'终端 · tmux', bundle:'com.apple.Terminal', actions:[
      { cmd:16, icon:'▥', name:'左右分屏', keys:['⌃B','%'] },
      { cmd:17, icon:'▤', name:'上下分屏', keys:['⌃B','"'] },
      { cmd:18, icon:'↹', name:'下一个面板', keys:['⌃B','O'] },
      { cmd:19, icon:'⤢', name:'放大 / 还原', keys:['⌃B','Z'] },
      { cmd:20, icon:'✕', name:'关闭面板', keys:['⌃B','X'] },

    { id:'figma', name:'Figma', bundle:'com.figma.Desktop', actions:[

      { cmd:33, icon:'⇱', name:'适应画布', keys:['⇧','1'] },
      { cmd:34, icon:'▦', name:'切换网格', keys:['⌃','G'] },
    ]},
    { id:'code', name:'VS Code', bundle:'com.microsoft.VSCode', actions:[
      { cmd:48, icon:'⌕', name:'全局搜索', keys:['⇧⌘','F'] },
      { cmd:49, icon:'⌘', name:'命令面板', keys:['⇧⌘','P'] },

  ],
  macApp:'tmux',
  pScreen:'home', keyOn:true, battOk:true, moreP:false,

    { id:'m1', name:'Jingmin 的 MacBook', key:166, state:'locked' },

let S = fresh();
let ann = true, sub = 'macPhone', chapter = 'read';

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* 给流程章节用：在一个覆盖过的状态上画一帧，不动 S。 */
const at = (patch, fn) => { const keep = S; S = Object.assign({}, keep, patch); try { return fn(); } finally { S = keep; } };

const ICON = {
  dash:'<rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/>',
  sliders:'<line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/>',
  flower:'<circle cx="12" cy="12" r="3"/><path d="M12 9V3M12 21v-6M9 12H3M21 12h-6"/>',

  phone:'<rect x="5" y="2" width="14" height="20" rx="2"/><path d="M12 18h.01"/>',
  cmd:'<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8"/><path d="M12 16v4"/>',
  gear:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9M4.6 9a1.7 1.7 0 0 0-.3-1.9"/>',
  key:'<circle cx="7.5" cy="15.5" r="4.5"/><path d="m10.7 12.3 8.8-8.8"/><path d="m17 6 3 3"/>',
  lock:'<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
  a11y:'<circle cx="12" cy="4" r="2"/><path d="M19 8h-5l-2 5-2-5H5M12 13v8M12 21l-3-3M12 21l3-3"/>',
  ruler:'<path d="M3 8h18v8H3z"/><path d="M7 8v3M11 8v5M15 8v3M19 8v5"/>',
};
const svg = d => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">${d}</svg>`;
const NAV = [
  { g:'休息', items:[ { id:'x1', label:'今日概览', i:ICON.dash }, { id:'x2', label:'休息计划', i:ICON.sliders },
                     { id:'x3', label:'休息灵感', i:ICON.flower }, { id:'x4', label:'我的记录', i:ICON.chart } ]},
  { g:'手机控制', items:[ { id:'phone', label:'手机控制', i:ICON.phone }, { id:'shortcuts', label:'快捷键设置', i:ICON.cmd } ]},
  { g:'其它', items:[ { id:'settings', label:'偏好设置', i:ICON.gear } ]},
];
const appById = id => S.apps.find(a => a.id === id) || S.apps[0];
const macById = id => S.macs.find(m => m.id === id) || S.macs[0];
const arrOf = id => (S.arrange[id] = S.arrange[id] || { hidden:[], order:[] });
const brand = () => `<div class="phead"><span class="mark m"><i></i><i></i><i></i><i></i></span>
  <span><span class="pword">outsie<em>.</em></span><div class="ptag">手机钥匙</div></span></div>`;

/* 手机想怎么看这份目录。没见过的东西排最后、保持可见：反过来的默认值，
   会把一次成功的同步变成一次看起来失败的同步。 */
function viewActions(macId, appId, includeHidden) {
  const a = arrOf(macId), app = appById(appId);
  const rank = new Map(a.order.map((c, i) => [c, i]));
  return app.actions.map((act, i) => ({ act, i }))
    .sort((p, q) => (rank.has(p.act.cmd) ? rank.get(p.act.cmd) : a.order.length + p.i)
                  - (rank.has(q.act.cmd) ? rank.get(q.act.cmd) : a.order.length + q.i))
    .map(p => p.act).filter(x => includeHidden || !a.hidden.includes(x.cmd));
}

function phoneHome() {

      <div class="plinks"><span class="plink" data-act="goCal" data-v="${m.id}">重新量距离</span>

      <div class="pbtn" style="margin-top:10px" data-act="unpair">和所有 Mac 解除配对</div>` : ''}
    <p class="ptiny">手机钥匙用不了的时候，密码照常能登录。</p>`;
}

function phoneControl() {
  const m = macById(S.controlMac), has = S.catalogues[m.id];
  const a = arrOf(m.id);
  const total = S.apps.reduce((n, x) => n + x.actions.length, 0);
  const cur = appById(S.pApp);
  const vis = has ? viewActions(m.id, cur.id, false) : [];
  const hid = has ? viewActions(m.id, cur.id, true).filter(x => a.hidden.includes(x.cmd)) : [];
  const tile = (x, hidden) => `<div class="tile ${hidden ? 'hidden' : ''}" draggable="${S.editing && !hidden ? 'true' : 'false'}"
      data-drag="${x.cmd}" ${S.editing ? '' : `data-act="press" data-v="${x.cmd}"`}>
      ${S.editing ? `<span class="tx" data-act="hideAct" data-v="${x.cmd}">${hidden ? '＋' : '×'}</span>` : ''}
      <span class="ti">${x.icon}</span><span class="tn">${esc(x.name)}</span></div>`;
  return `${brand()}
    <span class="pback" data-act="pScreen" data-v="home">‹ 返回</span>
    <p class="ptitle">${esc(m.name)}</p>
    <p class="plead">按一下，那台 Mac 会先切到这个 App，再替你按键。</p>
    <div class="psync"><span class="s">${S.syncing ? '正在从 Mac 拿列表。Mac 要在附近，而且开着 Outsie。'
      : has ? `${total} 个操作。在 Mac 上改过，就再同步一次。` : '还没同步过。'}</span>
      <span class="pbtn" style="padding:0 16px" data-act="sync">同步</span></div>
    ${!has ? `<div class="pnote info">这台电脑还没同步过按钮。在 Mac 的「快捷键设置」里配好，同步过来就在这里。</div>`
    : `<div class="apptabs" style="margin-top:14px">${S.apps.map(x => `<button class="apptab ${x.id === cur.id ? 'on' : ''}"
          data-act="pApp" data-v="${x.id}">${esc(x.name)}</button>`).join('')}</div>
      <div class="grid" id="grid">${vis.map(x => tile(x, false)).join('')}
        ${vis.length ? '' : '<p class="plead" style="grid-column:1/-1;margin:4px">这个 App 的按钮都被你收起来了。</p>'}</div>
      ${S.editing && hid.length ? `<p class="plabel">收起来的</p><div class="grid">${hid.map(x => tile(x, true)).join('')}</div>` : ''}
      <div class="plinks" style="justify-content:space-between">
        <span class="plink" data-act="edit">${S.editing ? '完成' : '整理'}</span>
        ${S.editing ? '<span class="plink" data-act="resetArrange">恢复成 Mac 上的顺序</span>' : ''}</div>
      ${S.editing ? `<div class="pnote amber">收起来只是这里不显示。要真的不让这部手机按键，去 Mac 上关掉它。</div>` : ''}`}
    <div class="pnote info" style="margin-top:14px">按钮只负责发出去。按没按成，要看那台 Mac。</div>`;
}

function phoneCal() {
  const m = macById(S.controlMac), c = S.cal || { step:0 };
  const p = S.phones[0];
  const body = [
    `<div class="phero"><div class="disc">📏</div><h3>教它认出你的距离</h3>
      <p>Mac 靠信号强弱猜你在不在。每个房间都不一样，所以要在<b>你平常用它的地方</b>量一次。</p></div>
     <div class="pnote info">${p.near == null ? '这台电脑还没量过。' : `上次是 ${p.calAt}量的。重新量的时候，旧的先照常用着；量不出结果，旧的也不会变。`}</div>
     <div class="pbtn primary" style="margin-top:14px" data-act="calNext">先坐到平常的位置</div>`,
    `<div class="phero"><div class="disc">🪑</div><h3>坐着别动</h3><p>正在量你在座位上时的信号。看这块屏就好，Mac 那边什么都不用做。</p></div>
     ${c.secs == null ? '<p class="ptiny" style="margin-top:14px">正在叫 Mac 开始…</p>'
       : `<div class="pbar"><i style="width:${100 - (c.pct || 0)}%"></i></div><p class="ptiny" style="margin-top:4px">还有 ${c.secs} 秒。</p>`}`,
    `<div class="phero"><div class="disc">🚶</div><h3>现在拿着手机走开</h3><p>走到你平常会离开的距离。门口、茶水间、另一个房间都行。<b>到了再按下面这个。</b></p></div>
     <div class="pnote info">路上不量。量的是你站定之后的信号，走动中的那一段混进去，两边就会像。</div>
     <div class="pbtn primary" style="margin-top:14px" data-act="calFar">到了，开始量</div>`,
    `<div class="phero"><div class="disc">🧍</div><h3>站着别动</h3><p>正在量你走开之后的信号。</p></div>
     <div class="pbar"><i style="width:${100 - (c.pct || 0)}%"></i></div><p class="ptiny" style="margin-top:4px">还有 ${c.secs || 0} 秒。别看屏，站着就行。</p>`,
    `<div class="phero"><div class="disc">✅</div><h3>分得很清楚</h3><p>在座位上和走开了，Mac 现在分得出来。从这次起就用新的。</p></div>
     <div class="pbtn primary" style="margin-top:14px" data-act="calDone">好</div>`,
    `<div class="phero"><div class="disc">🤔</div><h3>两边太像了</h3><p>在座位上和走开了，信号差不多。这次的量不出结果，不能用。</p></div>
     <div class="pnote info">常见原因：走得不够远，手机在包里，中间隔着墙或金属。换个走法再来一次通常就好。
       ${p.near == null ? '' : '<br>上次量的那组还在用，一个数都没变。'}</div>
     <div class="pbtn primary" style="margin-top:14px" data-act="calNext">再量一次</div>
     <div class="pbtn" style="margin-top:10px" data-act="calDone">${p.near == null ? '先用默认值' : '先用上次的'}</div>`,
    `<div class="phero"><div class="disc">🚶</div><h3>走回去就完成</h3><p>走开之后 Mac 听不到手机了。这最清楚。走回 Mac 旁边，它就把这次记下来。</p></div>
     <p class="ptiny" style="margin-top:14px">正在等 Mac 回话…</p>`,
  ][c.step];
  return `${brand()}<span class="pback" data-act="pScreen" data-v="home">‹ 返回</span>
    <p class="ptitle">${esc(m.name)}</p>${body}`;
}

function phonePair() {
  const s = S.pair || { step:0 };
  const body = [
    `<div class="phero"><div class="disc">📡</div><h3>准备好了</h3><p>在 Mac 上点「配一部新手机」，这里会自己接上。</p></div>`,
    `<div class="phero"><div class="disc">👀</div><h3>核对这六位数字</h3><p>Mac 上现在也显示着同一串。</p></div>
     <p style="font-family:var(--mono);font-size:30px;letter-spacing:.18em;color:var(--green);text-align:center;margin:16px 0 6px">793 675</p>
     <p class="ptiny" style="margin-top:0">两边一样，中间就没有人冒充。</p>
     <div class="pbtn primary" style="margin-top:14px" data-act="pairOk">一样，完成配对</div>
     <div class="pbtn" style="margin-top:10px" data-act="pairNo">不一样，停下</div>`,
    `<div class="phero"><div class="disc">✅</div><h3>配好了</h3><p>接下来量一次距离，Mac 才知道你什么时候算「在」。</p></div>
     <div class="pbtn primary" style="margin-top:14px" data-act="goCal" data-v="m1">量一次距离</div>`,

}

function phone(cls) {
  const body = { home:phoneHome, control:phoneControl, cal:phoneCal, pair:phonePair }[S.pScreen]();
  return `<div class="framewrap"><div class="phone ${cls || ''}"><div class="pscreen">
    <div class="pstatus"><span>08:12</span><span>▮ ▲ ▰</span></div><div class="pbody">${body}</div></div></div>
    ${S.sheet ? `<div class="sheet"><div class="sheetbox"><h3>${S.sheet.title}</h3><p>${S.sheet.body}</p>
      <div class="sheetacts"><div class="pbtn" style="flex:1" data-act="sheetNo">算了</div>
      <div class="pbtn primary" style="flex:1" data-act="sheetYes">${S.sheet.yes}</div></div></div></div>` : ''}
    ${S.ptoast ? `<div class="ptoast">${S.ptoast}</div>` : ''}</div>`;

      `<h3>正在找你的手机</h3><p>在手机上打开 Outsie，它会自己出现。两边都要在场，没有二维码，也不用账号。</p>

      `<h3>核对这六位数字</h3><p>手机上现在也显示着同一串。两边都要点一下，先点哪边都行。</p>
       <div class="sasnum">793 675</div><p style="margin:0 0 16px">两边一样，中间就没有人冒充。</p>
       <div class="sheetacts" style="justify-content:flex-end"><button class="btn outline" data-act="pairAbort">不一样，停下</button>
       <button class="btn primary" data-act="pairNext">和手机上一样</button></div>`,
      `<h3>还差手机上那一下</h3><p>这台 Mac 已经记住「真我GT5 Pro」。在手机上点「一样，完成配对」，这里会自己变成完成。</p>
       <p style="text-align:center;color:var(--green);letter-spacing:.4em;margin:18px 0">• • •</p>`,
      `<h3>配好了</h3><p>接下来在<b>手机上</b>量一次距离。你会拿着手机走动，所以那一步不在这里。</p>
       <div class="sheetacts" style="justify-content:flex-end"><button class="btn primary" data-act="msClose">好</button></div>`,
    ];
    return `<div class="macsheet"><div class="macsheetbox"><div class="stepdots">${[0,1,2,3].map(i => `<i class="${i <= s.step ? 'on' : ''}"></i>`).join('')}</div>${b[s.step]}</div></div>`;
  }
  if (s.kind === 'rec') {
    return `<div class="macsheet"><div class="macsheetbox"><h3>${s.editing ? '重新录一次' : '加一个操作'}</h3>
      ${s.editing ? '' : `<p style="margin-bottom:8px">叫什么</p><input id="recName" value="${esc(s.name)}" placeholder="比如：左右分屏" ${s.armed ? 'disabled' : ''}
        style="width:100%;padding:9px 12px;border-radius:9px;border:1px solid var(--line-chip);background:var(--bg);color:var(--text);font:inherit;font-size:13px;margin-bottom:14px">`}
      <p>按什么就记什么，按几下记几下。比如先 <span class="kbd">⌃B</span> 再 <span class="kbd">%</span>。</p>
      <div style="display:flex;gap:6px;min-height:34px;align-items:center;margin:4px 0 12px">
        ${s.keys.length ? s.keys.map(k => `<span class="kbd">${esc(k)}</span>`).join('') : '<span style="font-size:12px;color:var(--muted)">还没按</span>'}</div>
      <p style="font-size:11.5px">${s.armed ? '现在按的键只会记在这里，不会传到别的 App。<b>真的按一下键盘试试。</b>' : '先起名字，再开始录。不然打字的每个字母都会被记成按键。'}</p>
      <div class="sheetacts" style="justify-content:flex-end"><button class="btn outline" data-act="msClose">算了</button>
        ${s.armed ? `<button class="btn outline" data-act="recClear">重来</button><button class="btn primary" data-act="recDone">就这些</button>`
                  : `<button class="btn primary" data-act="recArm">开始录</button>`}</div></div></div>`;
  }
  return `<div class="macsheet"><div class="macsheetbox"><h3>${s.title}</h3><p>${s.body}</p>
    <div class="sheetacts" style="justify-content:flex-end"><button class="btn" data-act="msNo">算了</button>
    <button class="btn primary" data-act="msYes">${s.yes}</button></div></div></div>`;
}

/* ═══════════════════ 文档部件 ═══════════════════ */
const spec = h => ann ? `<div class="spec">${h}</div>` : '';
function after(rows) {
  return `<div class="tbl-wrap"><table class="after"><tr><th>按下</th><th>之后</th><th>做不到的时候</th></tr>
    ${rows.map(r => `<tr><td>${r[0]}</td><td>${r[1]}</td><td class="fail">${r[2]}</td></tr>`).join('')}</table></div>`;
}
/* 流程：一排帧，每帧下面一句话。不用点。 */
function board(frames) {
  return `<div class="board">${frames.map(f => {
    const isMac = f.html.includes('class="mac');
    const w = isMac ? 420 : (f.html.includes('phone sm') ? 150 : 181), h = isMac ? 328 : (f.html.includes('phone sm') ? 307 : 370);
    return `<div class="bf" style="width:${w}px"><div class="bcap"><b>${f.n}</b> ${f.cap}</div>
      <div class="fz" style="width:${w}px;height:${h}px">${f.html}</div></div>`; }).join('')}</div>`;
}

{ id:'pair', n:'05', g:'流程', t:'配对，然后量距离', render: () => {

  <p class="section-lede">五步，跨两块屏。先点哪边都行。重要的是两边都点，以及 Mac 最后等的是一个信号，不是一句话。<b>量距离整个在手机上</b>：你拿着手机走动，看不见 Mac 的屏幕。</p>
  ${board(fr)}
  <div class="plate stack">${spec(`<h4>为什么只有一个编号</h4><p>这六位是整个配对里唯一需要人核对的东西。曾经紧接着弹出一串八位十六进制「配对编号」，没有任何东西说明该核对哪一个。在一个防中间人的流程里，那正是攻击者需要的困惑。</p>
    <h4>「不一样，停下」是一个真答案</h4><p>不是取消。按了之后不要就着这次重试。允许重试等于让对方一直猜，六位数字就不再是六位数字。</p>
    <h4>远处不自动开始</h4><p>近处量完，手机停在「走开」那一屏，等你按「到了」。路上的信号是从近到远的一条斜线，混进远处那一组，两组就会挨在一起。这是「两边太像」最常见的成因，靠一个按钮就能挡掉。</p>
    <h4>远处听不见也是答案</h4><p>「到了」本身是一条蓝牙指令，从远处发出。远处出了范围，Mac 就永远收不到它，两边一起干等——真机上第一次走就卡在这里。所以远处倒数完没有结果，不算失败：手机说「走回去就完成」，走近之后把「远处结束」补送给 Mac，Mac 把远处记成「听不见」。走开之后互相听不见，是分得最清楚的一种。只有近处听不到手机才是失败。</p>
    <h4>倒数，不计时</h4><p>两段各 20 秒，Mac 和手机用同一个数。屏上是倒数的圈，告诉你还要站多久；「N 秒了」是在让你猜。</p>
    <h4>量距离必须能失败</h4><p>两边太像时给原因和两个出口。一个不能失败的校准，只会写进一个它自己都不信的数字。</p>
    <h4>Mac 是尺子，手机是遥控器</h4><p>信号是 Mac 听到的，手机自己量不了。所以手机发指令、Mac 采样、Mac 把进度用状态信标报回来。这需要状态字节多几个取值，见第 14 章。</p>`)}</div>
  ${after([
    ['配一部新手机','Mac 开始找；手机上打开 Outsie 就出现。','手机没开蓝牙时停在「正在找」，说去哪儿开。'],
    ['和手机上一样','Mac 记下这次交换，等手机用上新钥匙。','两边不一样：按「不一样，停下」，这次作废，不重试。'],
    ['一样，完成配对（手机）','手机写入钥匙，开始用它签名。','钥匙位被占的情形还没处理（未实现，见第 15 章）。'],
    ['先坐到平常的位置','Mac 采 20 秒近处，手机倒数。量完停在「走开」那一屏。','这 20 秒里 Mac 没听到手机：说「没听到手机」，两个出口。'],
    ['到了，开始量','手机倒数 20 秒，Mac 同时采远处。路上不量。','走动中的信号混进去，两边就会像，所以远处不自动开始。'],
    ['（远处倒数完）','有结果就出结果。没有，就是 Mac 没听到「到了」：手机说「走回去就完成」。','远处听不见不是失败，是最清楚的一种结果。'],
    ['（走回去）','手机把「远处结束」补送给 Mac，Mac 记下这次，回「量好了」。','两分钟还没回话：「Mac 没回音」。'],
    ['（远处量完）','出结果。','两边太像：走失败屏，给原因和两个出口。'],
    ['再量一次','回到「先坐到平常的位置」。旧的还在用。','—'],
    ['先用上次的 / 先用默认值','关掉，什么都没变。','—'],
  ])}`;
}},

{ id:'proto', n:'14', g:'参考', t:'协议', render: () => `
  <span class="chnum">14</span><h2>协议</h2>
  <h3 style="margin-top:20px">在场信标 <code>repose-presence-v2</code>（手机 → Mac，不可连接）</h3>
  <pre class="proto"><code>服务 UUID  0xFFF0
载荷       version(1) ‖ keyId(1) ‖ cmd(1) ‖ seq(4 BE) ‖ tag(8)        15 字节
预映像     "repose-presence-v2 beacon" ‖ keyId ‖ counter(8 BE) ‖ cmd ‖ seq
tag        HMAC-SHA256(K, msg)[0..8)
counter    floor(unix / 30)，从不传输，两端各自推算，±1 容差
cmd        0 无 · 1 锁屏 · 3 请求列表 · 4 开始量近处 · 5 开始量远处 · 6 远处结束，定下来 · 16.. 快捷键
           ← 6 是手机远处倒数完还没结果时发的；走回去 Mac 才听得到，所以每 20 秒重发到有结果
seq        手机持久化递增；Mac 只接受严格更大的</code></pre>
  <h3 style="margin-top:24px">状态信标 <code>repose-macstate-v2</code>（Mac → 手机）</h3>
  <pre class="proto"><code>服务 UUID  0xFFF7
载荷       version(1) ‖ keyId(1) ‖ macId(2) ‖ state(1) ‖ tag(8)       13 字节
承载       BLE 本地名，base64url 18 字符
state      0 开着 · 1 锁着 · <b>2 量近处 · 3 近处好了，等你走开 · 4 量远处 · 5 量好了 · 6 两边太像 · 7 没听到手机</b>
           ← 量距离在手机上，靠这几个值报进度。3 是必须有的：远处不自动开始，Mac 要说「等你」
           ← 7 只出自近处那 20 秒。远处听不到手机是「量好了」（远处记成听不见），不是 7
macId      硬件 UUID 的 SHA-256 前两字节，纳入预映像</code></pre>
  <h3 style="margin-top:24px">按钮列表 <code>repose-console-v1</code>（Mac → 手机，短时可连接）</h3>
  <pre class="proto"><code>服务 UUID  0xFFF9   特征 0xFFFA
分片       idx(2 BE) ‖ total(2 BE) ‖ bytes
整体       version(1) ‖ revision(4 BE) ‖ jsonUtf8 ‖ tag(16)
tag        HMAC(K_cat, "repose-console-v1 catalogue" ‖ 整体去掉 tag)[0..16)
窗口       点「同步」之后开 60 秒
归档       按验签匹配上的那把钥匙存，也就是哪台 Mac 发的</code></pre>
  <h3 style="margin-top:24px">配对 <code>repose-pair-v3</code></h3>
  <pre class="proto"><code>GATT FFF1   FFF2 写 PK_M · FFF3 读 PK_P‖Cp · FFF4 写 Nm · FFF5 读 Np · FFF6 名字 · FFF8 读 keyId‖phoneId
记录        SHA256("repose-pair-v3 sas" ‖ pkM ‖ pkP ‖ nm ‖ np ‖ keyId ‖ phoneId)
keyId       手机首次配对时自己取 1..255；Mac 槽位被占则回「换一个」</code></pre>
  <p class="section-lede"><b>keyId 由手机拥有。</b>一部手机配多台 Mac 时只有一套广播，只能带一个 keyId。由 Mac 分配，第二台就会要求改号，改号会让第一台认不出它。</p>` },

  $('#main').innerHTML = `<div class="chapter stage" data-product="${document.documentElement.dataset.product || 'light'}">${c.render()}</div>`;
  let g = '';
  $('#rail').innerHTML = CH.map(x => { let o = ''; if (x.g !== g) { g = x.g; o += `<p class="railgrp">${g}</p>`; }
    return o + `<button class="railitem ${x.id === chapter ? 'on' : ''}" data-ch="${x.id}"><span class="n">${x.n}</span>${x.t}</button>`; }).join('');
  wireDrag();
}
function toast(msg, phoneSide) {
  if (phoneSide) { S.ptoast = msg; setTimeout(() => { S.ptoast = null; render(); }, 2600); }
  else { S.toast = msg; setTimeout(() => { S.toast = null; render(); }, 2600); }
  render();
}
let timer = null;
const step = (fn, ms) => { clearTimeout(timer); timer = setTimeout(fn, ms); };
function pairTick() {
  const s = S.macSheet; if (!s || s.kind !== 'pair' || s.step !== 0) return;
  s.pct = Math.min(100, s.pct + 20);
  if (s.pct >= 100) { s.step = 1; S.pair = { step:1 }; }
  render(); if (s.step === 0) step(pairTick, 420);
}
function calTick() {
  const c = S.cal; if (!c || (c.step !== 1 && c.step !== 3)) return;
  c.pct = Math.min(100, c.pct + 14); c.secs = Math.max(0, 20 - Math.round(c.pct * 0.2));
  // 近处量完停在「走开」那一屏，等人按「到了」。远处不自动开始。
  // 远处倒数完还没有结果，就是 Mac 没听到「到了」：走回去就完成。
  if (c.pct >= 100) { if (c.step === 1) { c.step = 2; c.pct = 0; c.secs = 0; } else { c.step = c.forceFail ? 5 : 6; } }
  render(); if (c.step === 1 || c.step === 3) step(calTick, 380);
}

/* 拖动排序：HTML5 dnd 就够了，原型里用鼠标。手机上是长按拿起。 */
let dragging = null;
function wireDrag() {
  document.querySelectorAll('.tile[draggable="true"]').forEach(t => {
    t.addEventListener('dragstart', e => { dragging = +t.dataset.drag; t.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; });
    t.addEventListener('dragend', () => { dragging = null; render(); });
    t.addEventListener('dragover', e => { e.preventDefault(); t.classList.add('over'); });
    t.addEventListener('dragleave', () => t.classList.remove('over'));
    t.addEventListener('drop', e => { e.preventDefault(); const to = +t.dataset.drag; if (dragging != null && dragging !== to) moveAct(dragging, to); dragging = null; render(); });
  });
}
function moveAct(from, to) {
  const a = arrOf(S.controlMac), app = appById(S.pApp);
  const vis = viewActions(S.controlMac, app.id, false).map(x => x.cmd);
  const hid = viewActions(S.controlMac, app.id, true).map(x => x.cmd).filter(c => a.hidden.includes(c));
  const i = vis.indexOf(from), j = vis.indexOf(to); if (i < 0 || j < 0) return;
  vis.splice(j, 0, vis.splice(i, 1)[0]);
  const mine = new Set(vis.concat(hid));
  a.order = vis.concat(hid).concat(a.order.filter(c => !mine.has(c)));   // 整份顺序写下来
}

document.addEventListener('click', e => {
  const ch = e.target.closest('[data-ch]');
  if (ch) { chapter = ch.dataset.ch; window.scrollTo(0, 0); render(); return; }
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act, v = el.dataset.v; e.preventDefault();
  const A = {
    sub: () => { sub = v; if (v === 'macPhone') S.macTab = 'phone'; if (v === 'macShort') S.macTab = 'shortcuts';
                 if (v === 'pHome') S.pScreen = 'home'; if (v === 'pControl') { S.pScreen = 'control'; S.catalogues[S.controlMac] = true; } },
    macTab: () => { S.macTab = v; }, macApp: () => { S.macApp = v; }, pApp: () => { S.pApp = v; },
    pScreen: () => { S.pScreen = v; S.editing = false; },
    presence: () => { S.presence = !S.presence; }, idleLock: () => { S.idleLock = !S.idleLock; },
    keyOn: () => { S.keyOn = !S.keyOn; }, batt: () => { S.battOk = true; toast('好了，它会留在后台。', true); },
    more: () => { S.more = !S.more; }, moreP: () => { S.moreP = !S.moreP; },
    grant: () => { S.a11y = true; toast('已允许 Outsie 替你按键。'); },
    cap: () => { const [id, k] = v.split(':'); const p = S.phones.find(x => x.id === id); p[k] = !p[k]; },
    pairStart: () => { S.macSheet = { kind:'pair', step:0, pct:0 }; S.pScreen = 'pair'; S.pair = { step:0 }; step(pairTick, 420); },
    pairPhone: () => { S.macSheet = { kind:'pair', step:0, pct:0 }; S.pScreen = 'pair'; S.pair = { step:0 }; S.macTab = 'phone'; step(pairTick, 420); },
    pairNext: () => { S.macSheet.step = 2; },
    pairAbort: () => { S.macSheet = null; S.pScreen = 'home'; S.pair = null; toast('这次作废了。重新开始一次，不要就着这次重试。'); },
    pairOk: () => { if (S.macSheet && S.macSheet.step === 2) { S.macSheet.step = 3; S.pair = { step:2 }; } },
    pairNo: () => { S.macSheet = null; S.pScreen = 'home'; S.pair = null; toast('停下了。重新开始一次配对。', true); },
    goCal: () => { S.controlMac = v || S.controlMac; S.macSheet = null; S.pScreen = 'cal'; S.cal = { step:0, pct:0, secs:0, forceFail: S.controlMac === 'm3' }; },
    calNext: () => { S.cal.step = 1; S.cal.pct = 0; S.cal.secs = 20; step(calTick, 380); },
    calFar: () => { S.cal.step = 3; S.cal.pct = 0; S.cal.secs = 20; step(calTick, 380); },
    calDone: () => { if (S.cal.step === 4) { const p = S.phones[0]; p.near = -57; p.far = -80; p.calAt = '9 月 12 日'; } S.cal = null; S.pScreen = 'home'; },
    msClose: () => { S.macSheet = null; if (S.pScreen === 'pair') S.pScreen = 'home'; S.pair = null; },
    addApp: () => { const id = 'app' + (S.apps.length + 1); S.apps.push({ id, name:'新加的 App', bundle:'com.example.new', actions:[] }); S.macApp = id; toast('加上了。给它加一个操作。'); },
    delApp: () => { S.apps = S.apps.filter(a => a.id !== v); if (!S.apps.length) S.apps.push({ id:'x', name:'空', bundle:'—', actions:[] }); S.macApp = S.apps[0].id; },
    delAct: () => { const a = appById(S.macApp); a.actions = a.actions.filter(x => x.cmd !== +v); },
    addAct: () => { S.macSheet = { kind:'rec', name:'', keys:[], armed:false, editing:false }; },
    rec: () => { const a = appById(S.macApp).actions.find(x => x.cmd === +v); S.macSheet = { kind:'rec', name:a.name, keys:[], armed:true, editing:true, cmd:a.cmd }; },
    recArm: () => { const i = document.getElementById('recName'); const nm = (i && i.value || '').trim(); if (!nm) return; S.macSheet.name = nm; S.macSheet.armed = true; },
    recClear: () => { S.macSheet.keys = []; },
    recDone: () => { const s = S.macSheet; if (!s.keys.length) return; const app = appById(S.macApp);
      if (s.editing) { app.actions.find(x => x.cmd === s.cmd).keys = s.keys.slice(); }
      else { const used = S.apps.flatMap(x => x.actions.map(y => y.cmd)); let cmd = 16; while (used.includes(cmd)) cmd++; app.actions.push({ cmd, icon:'⌨', name:s.name, keys:s.keys.slice() }); }
      S.macSheet = null; toast('写进去了。手机上同步一次，就看得到。'); },
    try: () => { const a = appById(S.macApp).actions.find(x => x.cmd === +v);
      toast(S.a11y ? `切到「${appById(S.macApp).name}」，按了「${a.name}」` : 'Outsie 还没被允许替你按键。去「手机控制」那一页允许它。'); },
    goControl: () => { S.controlMac = v; S.pScreen = 'control'; S.pApp = 'tmux'; S.editing = false; },
    lock: () => { if (!S.keyOn) return toast('手机钥匙关着。先打开上面的开关。', true); toast('已发出。Mac 在附近的话，几秒内会锁。', true); },
    sync: () => { const m = macById(S.controlMac); if (!S.keyOn) return toast('手机钥匙关着，Mac 收不到。', true);
      S.syncing = true; render(); step(() => { S.syncing = false; S.catalogues[m.id] = true; toast(`收到 ${S.apps.reduce((n,a)=>n+a.actions.length,0)} 个操作`, true); }, 1600); },
    press: () => { const m = macById(S.controlMac); if (!S.keyOn) return toast('手机钥匙关着。先去主屏打开。', true);
      if (m.state === 'silent') return toast('已发出。不过没听到这台 Mac，多半收不到。', true);
      toast('已发出。', true); },
    edit: () => { S.editing = !S.editing; },
    hideAct: () => { const a = arrOf(S.controlMac), c = +v; a.hidden = a.hidden.includes(c) ? a.hidden.filter(x => x !== c) : a.hidden.concat(c); },
    resetArrange: () => { S.arrange[S.controlMac] = { hidden:[], order:[] }; },
    forget: () => { const m = macById(v); S.sheet = { title:`移走「${m.name}」？`, body:'这部手机丢掉它那把钥匙，那台 Mac 就不会再因为你走近而解锁。那台 Mac 上的设置不会变，它只是认不出这部手机了。想恢复，重新配对。', yes:'移走',
      act:() => { S.macs = S.macs.filter(x => x.id !== v); delete S.catalogues[v]; } }; },
    unpair: () => { S.sheet = { title:'和所有 Mac 解除配对？', body:'所有 Mac 马上认不出这部手机。想再用，重新配对。', yes:'解除', act:() => { S.macs = []; S.catalogues = {}; S.moreP = false; } }; },
    sheetNo: () => { S.sheet = null; }, sheetYes: () => { const a = S.sheet.act; S.sheet = null; if (a) a(); },
    drill: () => toast('锁屏了。回来时密码框留空，按回车。'),
    uninstall: () => { S.macSheet = { title:'把这台 Mac 改回原样？', body:'锁屏规则从备份还原，组件删除，这台 Mac 上的钥匙删除。做完之后每一条都重新读一遍报给你。', yes:'改回原样', act:'uninstall' }; },
    msYes: () => { const s = S.macSheet; S.macSheet = null; if (s.act === 'uninstall') toast('✓ 锁屏规则已还原　✓ 组件已删除　✓ 钥匙已删除'); },
    msNo: () => { S.macSheet = null; },
  };
  if (A[act]) { A[act](); render(); }
});

window.addEventListener('keydown', e => {
  const s = S.macSheet; if (!s || s.kind !== 'rec' || !s.armed) return;
  e.preventDefault(); e.stopPropagation();
  if (['Shift','Control','Alt','Meta'].includes(e.key)) return;
  const mods = (e.ctrlKey ? '⌃' : '') + (e.altKey ? '⌥' : '') + (e.shiftKey ? '⇧' : '') + (e.metaKey ? '⌘' : '');
  const name = { ' ':'Space','Enter':'↩','Escape':'⎋','Tab':'⇥','Backspace':'⌫','ArrowUp':'↑','ArrowDown':'↓','ArrowLeft':'←','ArrowRight':'→' }[e.key] || e.key.toUpperCase();
  s.keys.push(mods + name); render();
}, true);

$('#themeBtn').addEventListener('click', () => { const d = document.documentElement.dataset.product === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.product = d; $('#themeBtn').textContent = d === 'dark' ? '深色' : '浅色'; render(); });
$('#annBtn').addEventListener('click', () => { ann = !ann; $('#annBtn').textContent = ann ? '开' : '关'; $('#annBtn').classList.toggle('on', ann); render(); });
$('#resetBtn').addEventListener('click', () => { S = fresh(); render(); });
document.documentElement.dataset.product = 'light';
render();
</script>
