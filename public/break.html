<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' customprotocol: asset:; script-src 'self'; style-src 'self'">
  <title>Repose · 屏幕休息中</title>
  <link rel="stylesheet" href="break.css">
</head>
<body>
  <div class="ambient one"></div><div class="ambient two"></div>
  <header><span class="brand">repose<span>.</span></span><span class="badge">●&nbsp; 屏幕休息中</span></header>
  <main>
    <div class="plant" aria-hidden="true">❦</div>
    <p class="eyebrow">A LITTLE PAUSE, JUST FOR YOU</p>
    <h1 id="title">让目光，离开屏幕一会。</h1>
    <p id="description">看向远处，放松双肩。接下来的时间，留给自己。</p>
    <div id="countdown" class="countdown" role="timer">00:20</div>
    <div class="progress"><span id="progress"></span></div>
    <p class="hint">休息结束后，屏幕会自动恢复</p>
    <button id="postpone" type="button" hidden>延迟 1 分钟 · 仅此一次</button>
    <p id="postpone-note" class="note" role="status"></p>
  </main>
  <footer><span>给日常，留一点空白。</span><span id="kind">强制休息 · 倒计时结束后恢复</span></footer>
  <script src="break.js"></script>
</body>
</html>
