[package]
name = "repose"
version = "0.6.2"
description = "A quiet macOS break reminder"
edition = "2024"

[workspace]
members = [
  ".",
  "crates/repose-authdb-policy",
  "crates/repose-unlock-core",
  "crates/repose-unlock-ipc",
  "crates/repose-unlock-service",
  "crates/repose-unlockctl",
]
resolver = "3"

[lib]
name = "repose_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
cc = "1"
tauri-build = { version = "2", features = [] }

[dependencies]
aes-gcm = "0.10"
hkdf = "0.12"
zeroize = { version = "1.8", features = ["derive"] }
base64 = "0.22"
p256 = { version = "0.13", default-features = false, features = ["ecdsa"] }
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"
repose-unlock-core = { path = "crates/repose-unlock-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
