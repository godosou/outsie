[package]
name = "repose"
version = "0.7.0"
description = "A quiet macOS break reminder"
edition = "2024"

[lib]
name = "repose_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# `outsie shortcuts`: the command line beside the app (design doc §07).
[[bin]]
name = "outsie"
path = "src/bin/outsie.rs"

[build-dependencies]
cc = "1"
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# In-process AppleScript, so the administrator prompt is attributed to Outsie
# instead of /usr/bin/osascript. See unlock.rs::run_privileged.
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSAppleScript", "NSString", "NSDictionary", "NSValue"] }

tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
