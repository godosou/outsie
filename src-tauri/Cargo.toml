[package]
name = "repose-lite"
version = "0.2.0"
description = "A quiet macOS break reminder"
edition = "2024"

[workspace]
members = [
  ".",
  "crates/repose-authdb-policy",
  "crates/repose-unlock-core",
  "crates/repose-unlock-ipc",
  "crates/repose-unlock-service",
  "crates/repose-unlockctl",
]
resolver = "3"

[lib]
name = "repose_lite_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
cc = "1"
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }

[dev-dependencies]
serde_json = "1"
