[package]
name = "repose-unlock-core"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[dependencies]
aes = { version = "0.8", default-features = false, features = ["zeroize"] }
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "zeroize"] }
hkdf = "0.12"
p256 = { version = "0.13", default-features = false, features = ["ecdh", "ecdsa"] }
parking_lot = "0.12"
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"
subtle = "2.6"
zeroize = { version = "1.8", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
