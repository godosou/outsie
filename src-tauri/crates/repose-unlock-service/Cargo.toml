[package]
name = "repose-unlock-service"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[lib]
path = "src/lib.rs"

[[bin]]
name = "repose-unlock-service"
path = "src/main.rs"

[dependencies]
libc = "0.2"
parking_lot = "0.12"
repose-unlock-core = { path = "../repose-unlock-core" }
repose-unlock-ipc = { path = "../repose-unlock-ipc" }

[dev-dependencies]
p256 = { version = "0.13", default-features = false, features = ["ecdsa"] }
serde_json = "1"
sha2 = "0.10"

[build-dependencies]
cc = "1"
