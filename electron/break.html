<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:">
  <title>Repose · 屏幕休息中</title>
  <link rel="stylesheet" href="break.css">
</head>
<body>
  <div class="ambient ambient-one"></div><div class="ambient ambient-two"></div>
  <header><span class="brand">repose<span>.</span></span><span class="badge"><i></i>屏幕休息中</span></header>
  <main>
    <div class="plant" aria-hidden="true"><svg width="176" height="176" viewBox="0 0 176 176" fill="none"><circle cx="88" cy="88" r="84" fill="#E3EAD9"/><path d="M88 138V74" stroke="#5B7151" stroke-width="4" stroke-linecap="round"/><path d="M89 109C51 110 41 83 43 65C74 62 95 79 89 109Z" fill="#8B9E73"/><path d="M89 89C89 56 110 37 137 42C140 68 121 88 89 89Z" fill="#566F49"/><path d="M89 109L58 81M89 89L122 56" stroke="#E3EAD9" stroke-opacity=".5" stroke-width="2" stroke-linecap="round"/><path d="M66 137H110L104 153H72L66 137Z" fill="#CBB99D"/></svg></div>
    <p class="eyebrow">A LITTLE PAUSE, JUST FOR YOU</p>
    <h1 id="title">让目光，离开屏幕一会。</h1>
    <p class="description" id="description">看向远处，放松双肩。接下来的时间，留给自己。</p>
    <div class="countdown" id="countdown" role="timer">00:20</div>
    <div class="progress"><span id="progress"></span></div>
    <p class="hint">休息结束后，屏幕会自动恢复</p>
    <div class="postpone-control">
      <button id="postpone" type="button" hidden>延迟 1 分钟 · 仅此一次</button>
      <p id="postpone-note" class="postpone-note" role="status" aria-live="polite"></p>
    </div>
  </main>
  <footer><span>给日常，留一点空白。</span><span id="kind">强制短休息 · 无需任何操作</span></footer>
  <script src="break-renderer.js"></script>
</body>
</html>
